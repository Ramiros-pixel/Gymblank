name: gym_slot
description: "GymSlot - aplikasi booking dan manajemen gym."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  google_sign_in: ^6.2.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/barlow_condensed/
    - assets/fonts/inter/

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
